<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrashLab Demo</title><style>*{box-sizing:border-box}body{margin:0;background:#070a10;color:#edf2f7;font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{height:64px;padding:0 18px;display:flex;align-items:center;border-bottom:1px solid #1a2433;background:#080c13}.logo{font-weight:900;letter-spacing:1px}.logo span{color:#37e39b}.demo{margin-left:14px;font-size:10px;color:#ffcf70;background:#2b2110;border:1px solid #57401c;padding:5px 8px;border-radius:6px}.online{margin-left:auto;font-size:11px;color:#37e39b}main{max-width:1100px;margin:18px auto;padding:0 12px}.card{background:#0b1019;border:1px solid #1b2636;border-radius:14px;overflow:hidden}.top{padding:13px 16px;border-bottom:1px solid #1b2636;display:flex;justify-content:space-between;color:#748195;font-size:10px;font-weight:800;letter-spacing:1px}.arena{height:440px;position:relative;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at center,#14263a 0,#0a111c 42%,#070a10 75%)}.grid{position:absolute;inset:0;opacity:.22;background-image:linear-gradient(#2a4059 1px,transparent 1px),linear-gradient(90deg,#2a4059 1px,transparent 1px);background-size:60px 60px;transform:perspective(500px) rotateX(55deg) scale(1.5);transform-origin:bottom}.mult{position:relative;font-size:72px;font-weight:950;letter-spacing:-4px;text-shadow:0 0 35px #37e39b33}.caption{position:relative;text-align:center;margin-top:10px;color:#718095;font-size:10px;letter-spacing:2px;font-weight:800}.controls{display:grid;grid-template-columns:1fr 150px 160px;gap:10px;padding:15px;border-top:1px solid #1b2636}.field label{display:block;color:#718095;font-size:9px;font-weight:800;margin-bottom:5px}.field input{width:100%;padding:11px;border-radius:8px;border:1px solid #1d2b3d;background:#080d15;color:white}button{border:0;border-radius:8px;font-weight:900;cursor:pointer;background:#37e39b;color:#06120e;margin-top:15px}button.cash{background:#ffca67}button:disabled{opacity:.35}.bottom{display:flex;gap:8px;flex-wrap:wrap;padding:13px 15px;border-top:1px solid #1b2636}.chip{font-size:10px;padding:6px 8px;border-radius:6px;background:#12261f;color:#5ee1ad}.chip.low{background:#21151a;color:#d28a9e}.note{color:#647287;font-size:10px;margin:12px 2px;text-align:center}@media(max-width:650px){.arena{height:360px}.mult{font-size:55px}.controls{grid-template-columns:1fr 1fr}.controls button{grid-column:1/-1;height:44px;margin-top:0}}</style></head><body><header><div class="logo">CRASH<span>LAB</span></div><div class="demo">DEMO MODE</div><div class="online">● ONLINE</div></header><main><div class="card"><div class="top"><span id="round">ROUND #1</span><span id="phase">WAITING</span></div><div class="arena"><div class="grid"></div><div><div class="mult" id="mult">1.00x</div><div class="caption" id="caption">PLACE YOUR BET</div></div></div><div class="controls"><div class="field"><label>USERNAME</label><input id="name" value="DemoUser"></div><div class="field"><label>DEMO BET</label><input id="amount" type="number" min="1" value="10"></div><button id="action">BET 10.00</button></div><div class="bottom" id="history"></div></div><div class="note">Demo only — no real money, deposits, withdrawals or payment processing.</div></main><script>let phase="WAITING",mult=1,crash=1,timer=null,round=1,activeBet=false;const $=id=>document.getElementById(id);function randomCrash(){return Math.max(1.01,Math.floor((1/(1-Math.random()))*100)/100)}function history(){let h=JSON.parse(localStorage.getItem("crashHistory")||"[1.12,2.41,1.07,5.63,1.82,3.14,1.31]");$("history").innerHTML=h.slice(0,12).map(x=>`<span class="chip ${x<2?"low":""}">${x.toFixed(2)}x</span>`).join("")}function setPhase(p){phase=p;$("phase").textContent=p;$("caption").textContent=p==="WAITING"?"PLACE YOUR BET":p==="RUNNING"?"FLYING...":"CRASHED"}function newRound(){clearInterval(timer);phase="WAITING";mult=1;crash=randomCrash();activeBet=false;$("action").className="";$("action").disabled=false;$("action").textContent="BET "+Number($("amount").value||0).toFixed(2);$("round").textContent="ROUND #"+round;setPhase("WAITING");$("mult").textContent="1.00x";setTimeout(start,2200)}function start(){setPhase("RUNNING");let start=Date.now();timer=setInterval(()=>{mult=Math.floor(Math.exp((Date.now()-start)/1000*.22)*100)/100;$("mult").textContent=mult.toFixed(2)+"x";if(mult>=crash){mult=crash;clearInterval(timer);crashed()}},70)}function crashed(){setPhase("CRASHED");$("mult").textContent=mult.toFixed(2)+"x";let h=JSON.parse(localStorage.getItem("crashHistory")||"[]");h.unshift(mult);localStorage.setItem("crashHistory",JSON.stringify(h.slice(0,12)));history();setTimeout(()=>{round++;newRound()},2500)}$("amount").oninput=()=>{if(!activeBet)$("action").textContent="BET "+Number($("amount").value||0).toFixed(2)}$("action").onclick=()=>{if(phase==="WAITING"){activeBet=true;$("action").className="cash";$("action").textContent="CASH OUT"}else if(phase==="RUNNING"&&activeBet){activeBet=false;$("action").disabled=true;$("action").textContent="CASHED OUT @ "+mult.toFixed(2)+"x";setTimeout(()=>$("action").disabled=false,1000)}}history();newRound();</script></body></html>
